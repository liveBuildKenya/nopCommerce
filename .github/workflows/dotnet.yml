name: Build & Deploy

on:
  repository_dispatch:
    types: [modulel-updated]
  workflow_dispatch:
  push:
    branches:
      - develop
      - release
  pull_request:
    branches:
      - develop
      - release

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout parent repo with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore src

      - name: Build
        run: dotnet build --no-restore --configuration Release src

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal src

      - name: Publish
        run: dotnet publish src/Presentation/Nop.Web/Nop.Web.csproj -c Release -o nopCommerce

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: nopCommerce

  deploy:

    runs-on: ubuntu-latest

    needs: build

    if: github.ref_name == 'release' && success()

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: app
          path: nopCommerce

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          export_environment_variables: false
          create_credentials_file: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Activate service account credentials
        run: |
          gcloud auth activate-service-account ${{ secrets.GCP_SERVICE_ACCOUNT }} --key-file="$GOOGLE_APPLICATION_CREDENTIALS"
          
      - name: Verify Authentication
        run: |
          gcloud auth list

      - name: List Configuration
        run: |
          gcloud config list

      - name: Copy file to compute engine
        run: |
          gcloud compute scp --recurse nopCommerce ${{ secrets.GCE_INSTANCE_NAME }}: --zone=${{ secrets.GCE_ZONE }}

      - name: Restart Service
        run: |
          gcloud compute ssh ${{ secrets.GCE_INSTANCE_NAME }} --zone=${{ secrets.GCE_ZONE }} --command="sudo systemctl restart nopCommerce"
